version: '3.9'

services:
  # ── Backend gRPC + HTTP gateway ──────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: pokereval-backend:dev
    container_name: pokereval-backend
    ports:
      - "50051:50051"   # gRPC
      - "8080:8080"     # HTTP gateway
    environment:
      GRPC_PORT: "50051"
      HTTP_PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Frontend Flutter web served via nginx ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: "http://localhost:8080"
    image: pokereval-frontend:dev
    container_name: pokereval-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
