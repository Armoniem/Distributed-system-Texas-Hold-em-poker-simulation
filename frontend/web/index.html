<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PokerEval – Enterprise Texas Hold'em Hand Evaluator & Win Probability Calculator">
  <meta name="keywords" content="poker, texas holdem, hand evaluator, win probability, monte carlo">
  <meta name="author" content="PokerEval">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Open Graph -->
  <meta property="og:title" content="PokerEval – Texas Hold'em Analyzer">
  <meta property="og:description" content="Evaluate hands, compare players, and calculate win probabilities using Monte Carlo simulation.">
  <meta property="og:type" content="website">

  <!-- iOS web app meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PokerEval">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>PokerEval – Texas Hold'em Analyzer</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0D0E1A;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #0D0E1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading-screen .logo {
      font-size: 48px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    #loading-screen h1 {
      color: #E8E9FF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 24px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.5px;
    }
    #loading-screen .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(108, 99, 255, 0.2);
      border-top-color: #6C63FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
    @keyframes spin  { to{transform:rotate(360deg)} }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="logo">♠♥♦♣</div>
    <h1>PokerEval</h1>
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var ls = document.getElementById('loading-screen');
      if (ls) {
        ls.style.opacity = '0';
        setTimeout(function() { ls.remove(); }, 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
